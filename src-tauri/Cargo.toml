[package]
name = "cairn"
description = "A local-first personal app for habits, passwords and finances."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The library holds everything. `main.rs` is a three line shim so that the same code can
# be driven by the desktop binary and, later, by the iOS entry point.
[lib]
name = "cairn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = ["isolation"] }

[dependencies]
tauri = { version = "2.11", features = ["isolation"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cairn-crypto.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
