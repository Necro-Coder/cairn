[package]
name = "cairn"
description = "A local-first personal app for habits, passwords and finances."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The library holds everything. `main.rs` is a three line shim so that the same code can
# be driven by the desktop binary and, later, by the iOS entry point.
[lib]
name = "cairn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = ["isolation"] }

[dependencies]
tauri = { version = "2.11", features = ["isolation"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cairn-crypto.workspace = true
cairn-domain.workspace = true
# The one crate that asks the operating system which time zone this device is in. The habit
# commands need it and nothing below them may: a streak counted in the wrong zone looks exactly
# like a correct one, so the question is asked here, at the boundary, and the answer travels
# down as an argument.
cairn-clock.workspace = true
cairn-db.workspace = true
uuid.workspace = true
cairn-platform.workspace = true
zeroize = { version = "1.9", features = ["alloc"] }
# The synchronisation primitives only. The runtime is the one Tauri already starts; these
# types are agnostic about which runtime drives them, and naming the crate that defines them
# is better than reaching for a re-export whose shape is not part of Tauri's contract.
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
thiserror.workspace = true
# The native file dialog, used from Rust and only from Rust. Its commands are never granted
# to the WebView in `capabilities/default.json`, so a path arriving from the other side of
# the bridge cannot exist: the person picks the file in a window the operating system drew.
# The npm half of this plugin is deliberately not installed, because the `runtime-deps` gate
# requires zero JavaScript dependencies at runtime and this feature does not need it.
tauri-plugin-dialog = "2"

[dev-dependencies]
serde_json = "1.0"
cairn-crypto.workspace = true
zeroize = { version = "1.9", features = ["alloc"] }

[lints]
workspace = true
