[package]
name = "cairn-clock"
description = "The one crate that asks the operating system which day it is, and where."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cairn-domain.workspace = true
thiserror.workspace = true

# The calendar and the time zone database.
#
# The features are added on top of the workspace entry, which deliberately carries none of them:
# the domain needs the calendar and nothing else, and this is the only crate that asks the
# operating system where it is.
#
# `tzdb-bundle-platform` embeds the database only on the targets that have no system copy of it,
# which among the ones this project builds for means Windows alone. On iOS and macOS nothing is
# embedded and the copy under `/usr/share/zoneinfo` is read instead, which is what
# `tzdb-zoneinfo` is for. `tz-fat` is left off: it buys lookup speed with binary size, and the
# lookups here happen once per screenful of days.
jiff = { workspace = true, features = [
    "tz-system",
    "tzdb-bundle-platform",
    "tzdb-zoneinfo",
] }

[lints]
workspace = true
