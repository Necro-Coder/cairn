secrecy = "0.10"
subtle = "2.6"
thiserror.workspace = true
zeroize = { version = "1.9", features = ["alloc", "derive"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
trybuild = "1.0.121"
