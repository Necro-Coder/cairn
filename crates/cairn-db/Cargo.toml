[package]
name = "cairn-db"
description = "Schema, migrations, repositories and opening the encrypted database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cairn-crypto.workspace = true
cairn-domain.workspace = true
cairn-platform.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize = { version = "1.9", features = ["alloc"] }

# The record stream inside a backup: one line of JSON per row, read and written without
# ever holding the whole file. Both were already in the graph through the application
# crate, so naming them here adds a direct edge and not a package.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Compression for that stream, before it is encrypted.
#
# The one dependency this project adds for the backup format. It lives here rather than in
# cairn-crypto, where the rest of the format lives, and the reason is not tidiness: it is a
# binding to a C library, and linking it into cairn-crypto would end that crate's ability to
# run under Miri. A crate whose `forbid(unsafe_code)` can no longer be checked by an
# interpreter is a crate whose guarantee covers the code and not what the code calls.
#
# `default-features = false` drops the multithreaded encoder, which this never uses: a
# backup is written once, on request, on a thread of its own already.
zstd = { version = "0.14", default-features = false }

# Not named by a single line of Rust in this crate, and that is deliberate: declaring it
# is the only way to pin the exact version of the OpenSSL sources that rusqlite pulls in
# transitively, because a version requirement can only be written where a dependency is
# declared. The reason for pinning it is in the workspace manifest.
#
# `cargo udeps` will report this as unused. It is unused as Rust code and load-bearing as
# a version constraint, and removing it would silently hand the choice of OpenSSL release
# to whoever runs `cargo update` next.
openssl-src.workspace = true

[[bench]]
# A plain binary rather than a harness, for the reason the one in cairn-crypto gives: what this
# produces is a handful of lines to read against the budgets the phase wrote down, not a
# distribution, and a benchmark framework here would be a dependency and a compile time bought
# for nothing.
name = "habits"
harness = false

[lints]
workspace = true
