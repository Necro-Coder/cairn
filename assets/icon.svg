<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cairn">
  <title>Cairn</title>

  <!--
    A cairn: stones stacked by hand to mark a place, stable only because each one is
    placed deliberately on the one below it.

    The same three stones as the brand glyph in `src/lib/icons/BrandMark.svelte`, scaled
    up. Three rather than four, and the top one a circle rather than a bar, because that
    is the silhouette that still reads as a stack at sixteen pixels in a taskbar.

    Flat vermilion on ink, hard corners, no gradient and no thin stroke: the same rules as
    everything else in `docs/design/design-system.md`. The square is deliberate — an icon
    with a large corner radius is the one part of this system that would look soft.
  -->

  <rect width="512" height="512" fill="#101011" />

  <g fill="#ff5a1f">
    <!-- Base: the widest and heaviest stone, seated low. -->
    <rect x="96" y="352" width="320" height="80" />
    <!-- The middle stone, narrower, with a clear gap under it. -->
    <rect x="136" y="232" width="240" height="80" />
    <!-- The capstone: round, which is what makes the pile read as a marker. -->
    <circle cx="256" cy="144" r="68" />
  </g>
</svg>
