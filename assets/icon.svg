<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cairn">
  <title>Cairn</title>

  <!--
    A cairn: stones stacked by hand to mark a place, stable only because each one is
    placed deliberately on the one below it.

    Drawn for the smallest size it has to survive. At sixteen pixels the taskbar shows
    roughly three bands of light on dark, so the silhouette is four stones with clear gaps
    and nothing else. No thin strokes, no gradients, no text, no detail that turns to mud
    when the icon is a few pixels tall.
  -->

  <rect width="512" height="512" rx="112" fill="#14161A" />

  <g fill="#E8EAED">
    <!-- Base: the widest and heaviest stone, seated low. -->
    <rect x="104" y="368" width="304" height="72" rx="36" />
    <!-- Third stone, offset slightly to break the symmetry, as a real stack would be. -->
    <rect x="132" y="272" width="240" height="70" rx="35" />
    <!-- Second stone. -->
    <rect x="158" y="180" width="188" height="66" rx="33" />
    <!-- Capstone, in the accent colour: the one that makes the pile a marker. -->
    <rect x="196" y="96" width="120" height="58" rx="29" fill="#7AA2F7" />
  </g>
</svg>
