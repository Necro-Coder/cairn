[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/cairn-crypto",
    "crates/cairn-domain",
    "crates/cairn-db",
    "crates/cairn-sync",
    "crates/cairn-platform",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Rubén Núñez Cotano"]
repository = "https://github.com/Necro-Coder/cairn"
publish = false

[workspace.dependencies]
cairn-crypto = { path = "crates/cairn-crypto" }
cairn-domain = { path = "crates/cairn-domain" }
cairn-db = { path = "crates/cairn-db" }
cairn-sync = { path = "crates/cairn-sync" }
cairn-platform = { path = "crates/cairn-platform" }

thiserror = "2.0"

# Row identifiers and the identifier of this installation. Raised to the workspace because two
# crates now need it and they must agree on the version: sixteen bytes read by one and written
# by the other would otherwise depend on two independent resolutions.
#
# `v4` is the only generator enabled. Every other version encodes a clock or a network address,
# and a row identifier that carries when and where it was made is a row identifier that leaks.
uuid = { version = "1.26", default-features = false, features = ["v4"] }

# SQLite, built from source as SQLCipher with its own copy of OpenSSL linked in.
#
# The feature is what makes the encrypted database possible on every platform this
# project targets. iOS ships no OpenSSL an application may link against and Windows
# ships none at all, so the only way to get one build of one cipher on both is to
# compile it here, from source, as part of this build.
#
# The cost is real and is written down in docs/development/getting-started.md: the
# first build compiles OpenSSL and SQLCipher in C and takes minutes rather than
# seconds, and on Windows it needs Perl and NASM on PATH.
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }

# Named here even though no line of Rust in this workspace uses it, and pinned to one
# exact version rather than a range.
#
# It is the most fragile link in the chain: it carries the OpenSSL sources and the
# build logic that cross-compiles them, and a new release of it is the single most
# likely thing to break the iOS build on a morning when nobody touched this repository.
# Pinned exactly, that upgrade can only arrive as a pull request the pipeline gets to
# judge, instead of arriving sideways the next time the lockfile is regenerated.
#
# The lockfile alone would not do this: it records what was resolved, not what is
# allowed, so `cargo update` would move it without anyone deciding to.
#
# The number is the one openssl-sys itself resolves to. Naming any other one does not
# override it: cargo would simply add a second, unused copy of the crate to the graph and
# leave the real build exactly where it was.
openssl-src = "=300.6.1"

# Lints applied to every crate in the workspace through `[lints] workspace = true`.
# Setting them here rather than in each lib.rs means a new crate cannot be created
# with a laxer policy by accident.
[workspace.lints.rust]
# `unsafe_code` is denied rather than forbidden so that `cairn-platform`, which is the
# one crate allowed to contain it, can relax the level in its own manifest. Every other
# crate additionally carries `#![forbid(unsafe_code)]`, which cannot be turned off.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
missing_docs = "warn"
# The MSVC linker prints an informational line every time it produces the import library
# for a cdylib, which the application crate is so that the same code can be driven by the
# iOS entry point later. It is not actionable and it is not a diagnostic about our code,
# but it would fail the `-D warnings` gate on every Windows build.
linker_messages = "allow"

[workspace.lints.clippy]
# Anything that can abort the process on a value the code did not check. These are the
# rules from the project conventions, enforced by the linter instead of by review.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "deny"
# Money and time are never floating point in this project.
float_arithmetic = "deny"
# Leftovers from debugging must not survive into a commit.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
# Broad quality groups, kept at warn so that they guide rather than block.
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Every crate in the workspace is private to it, so the version metadata lint is noise.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A panic with the vault unlocked kills the process instead of unwinding. Unwinding past
# a half-applied invariant is worse than stopping: there is no safe state to recover to.
panic = "abort"
strip = "symbols"
# Release builds disable overflow checks by default. For cryptographic and financial
# arithmetic that default is unacceptable, and the few percent it costs is worth
# removing an entire class of silent wraparound bugs.
overflow-checks = true
debug = false
incremental = false

[profile.release.package."*"]
opt-level = 3
