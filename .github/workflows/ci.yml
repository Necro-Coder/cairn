# Quality gates.
#
# Every check that can decide on its own whether a change is acceptable runs here, on
# every push and every pull request. Each one is its own step so that a red pipeline says
# which gate failed without anybody opening a log.
#
# Third party actions are pinned to a full commit SHA rather than a tag. A tag is a
# movable pointer: whoever controls the action repository can repoint it at different code
# and that code runs with this workflow's token. The comment after each SHA records which
# tag it corresponded to when it was pinned.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Read only by default. A job that genuinely needs to write says so for itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody reads is a warning that is not doing anything.
  RUSTFLAGS: -D warnings

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    # Read only, like every other job here. The scanner needs to ask which commits a pull
    # request contains, and that is the whole reason it gets a token.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because a secret that was removed in a later commit is
          # still a leaked secret.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the working tree and the history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # On a pull request the scanner asks the API which commits it has to look at, so
          # it refuses to run without a token. This is the one the runner mints for this
          # job, scoped by the permissions above, and it is never written to the log.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc rather than written here, so the pipeline and a developer's
          # machine cannot drift apart. They did once: npm 11 accepted a lockfile with an
          # optional peer dependency missing and npm 10 refused to install it, so the only
          # failure appeared here, on a tree that had passed every check locally.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the lockfile
        # No dependency gets to run a script during installation, here or anywhere else.
        run: npm ci --ignore-scripts

      - name: Check that nothing ships as a runtime dependency
        # The frontend has no runtime dependencies, and that is a property worth a gate
        # rather than a sentence in a document. Every package in the bundle is attack
        # surface in an application holding a password vault.
        run: |
          count=$(node -p "Object.keys(require('./package.json').dependencies ?? {}).length")
          if [ "$count" != "0" ]; then
            echo "::error::package.json declares $count runtime dependencies; it must declare none"
            node -p "JSON.stringify(require('./package.json').dependencies, null, 2)"
            exit 1
          fi

      - name: Formatting
        run: npm run format:check

      - name: Lints
        run: npm run lint

      - name: Types
        run: npm run check

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Advisories
        run: npm audit --omit=dev

      - name: Build the production bundle
        run: npm run build

      - name: Assert the preview module did not reach the bundle
        # The module that invents data is meant to be absent from a production build, not
        # merely unreachable in one. It is kept out by a build-time alias, and this checks
        # the artefact rather than the intention: a build flag is not a defence on its own,
        # because one badly placed import undoes it without saying anything.
        #
        # The marker is defined once, in that module, and shown to the person in the
        # banner, so the thing searched for here and the thing on screen cannot drift
        # apart. This step was verified by building in preview mode and confirming it is
        # found, then building normally and confirming it is not.
        run: |
          set -euo pipefail
          marker='CAIRN-PREVIEW-MOCK-DATA'
          if grep -rlF "$marker" dist/; then
            echo "::error::the preview module reached the production bundle; the files above contain its marker"
            exit 1
          fi
          echo "The production bundle does not contain the preview marker."

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the system libraries Tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install the pinned toolchain
        # rust-toolchain.toml decides the version. Naming one here as well would be a
        # second place to forget to update.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy, llvm-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-deny,cargo-audit,cargo-llvm-cov

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features --locked

      - name: Coverage
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 80

      - name: Licences, advisories, sources and bans
        run: cargo deny check

      - name: Advisories
        run: cargo audit

  ios-compile:
    name: ios compile
    # Pinned to an image rather than macos-latest. An image rollover changes the Xcode
    # version, the SDK and the toolchain that builds OpenSSL, and this job exists to
    # notice when the iOS build breaks. If the image moving underneath it were allowed to
    # break it, the signal would be worth nothing.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        # rust-toolchain.toml decides the version, here as everywhere else.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Add the iOS device target to the pinned toolchain
        # Added by a separate command rather than by an input to the action above, because
        # the action installs the toolchain it is named after and rust-toolchain.toml then
        # overrides which one cargo actually uses. A target added to the first would not be
        # present in the second, and the build would fail saying the target is not
        # installed, several minutes into the job. Run from the repository, `rustup` reads
        # the same override cargo does.
        #
        # The device target, not the simulator. What decides whether this architecture is
        # viable is the binary that would end up on a phone, and the simulator build is an
        # easier crossing that would answer a question nobody asked.
        run: rustup target add aarch64-apple-ios

      # Without a cache every run rebuilds OpenSSL and SQLCipher from C, which is most of
      # the time this job takes. GitHub scopes caches by branch on its own: a pull request
      # reads the cache of its base branch and writes only into its own scope, so one
      # branch cannot poison another's. That isolation comes from the platform rather than
      # from a key written here, which is why there is no per-branch key below.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The two profiles produce different artefacts from the same sources, so they do
          # not share an entry. The lockfile is already part of the key the action builds.
          key: aarch64-apple-ios-${{ github.event_name == 'pull_request' && 'debug' || 'release' }}

      - name: Decide which profile to build
        id: profile
        # Pull requests build debug so the loop stays short. Pushes to dev and main build
        # release, which is the path that actually ships: fat LTO, one codegen unit and
        # OpenSSL's assembly. Both get exercised every day without either slowing the
        # other down.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=debug" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "name=release" >> "$GITHUB_OUTPUT"
            echo "flag=--release" >> "$GITHUB_OUTPUT"
          fi

      - name: Cross compile the core for aarch64-apple-ios
        id: build
        # The five library crates by name rather than --workspace. The workspace also
        # contains the desktop binary, which needs the Xcode scaffolding that belongs to a
        # much later phase and would fail here for a reason that has nothing to do with
        # what this job measures. A gate that goes red for reasons nobody understands gets
        # switched off within a week.
        #
        # --locked because the point of pinning the OpenSSL sources is lost if the pipeline
        # is allowed to resolve something newer than the lockfile says.
        run: |
          set -euo pipefail
          started=$(date +%s)
          cargo build --locked --target aarch64-apple-ios ${{ steps.profile.outputs.flag }} \
            -p cairn-crypto \
            -p cairn-domain \
            -p cairn-db \
            -p cairn-sync \
            -p cairn-platform
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"

      - name: Report what it produced and how long it took
        # Two numbers in the job summary rather than a sentence. This is the baseline the
        # phase that puts the application on a phone will compare against, and a baseline
        # that has to be reconstructed from a log is a baseline nobody reconstructs.
        run: |
          set -euo pipefail
          profile='${{ steps.profile.outputs.name }}'
          out="target/aarch64-apple-ios/$profile"

          rust_bytes=0
          for rlib in "$out"/libcairn_*.rlib; do
            [ -e "$rlib" ] || continue
            rust_bytes=$(( rust_bytes + $(wc -c < "$rlib") ))
          done

          native_bytes=0
          while IFS= read -r archive; do
            native_bytes=$(( native_bytes + $(wc -c < "$archive") ))
          done < <(find "$out/build" \( -name 'libsqlite3.a' -o -name 'libcrypto.a' -o -name 'libssl.a' \) -print)

          # Zero here would mean the C libraries were never built, which is the one way
          # this job could pass while proving nothing at all.
          if [ "$native_bytes" -eq 0 ]; then
            echo "::error::no SQLCipher or OpenSSL archive was produced; the build linked something else"
            exit 1
          fi

          human() { awk -v bytes="$1" 'BEGIN { printf "%.2f MB", bytes / 1048576 }'; }

          {
            echo "### iOS cross compilation"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| target | \`aarch64-apple-ios\` |"
            echo "| profile | \`$profile\` |"
            echo "| runner image | \`macos-15\` |"
            echo "| build time | ${{ steps.build.outputs.seconds }} s |"
            echo "| Rust libraries, five crates | $(human "$rust_bytes") |"
            echo "| C libraries, SQLCipher and OpenSSL | $(human "$native_bytes") |"
            echo
            echo "Nothing was executed. This job compiles; it does not run a single line on"
            echo "a device or a simulator, and it does not claim to."
          } >> "$GITHUB_STEP_SUMMARY"

  unsafe-code:
    name: unsafe code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Assert that unsafe code appears only where it is allowed
        # cairn-platform is the one crate permitted to contain unsafe, because platform
        # APIs require it. Anywhere else it is a mistake, and this is what notices.
        run: |
          set -euo pipefail
          offenders=$(grep -rln --include='*.rs' -E '(^|[^_[:alnum:]])unsafe[[:space:]]' \
            crates/cairn-crypto/src \
            crates/cairn-domain/src \
            crates/cairn-db/src \
            crates/cairn-sync/src \
            src-tauri/src || true)
          if [ -n "$offenders" ]; then
            echo "::error::unsafe code found outside crates/cairn-platform:"
            echo "$offenders"
            exit 1
          fi
          echo "No unsafe code outside crates/cairn-platform."
